version: '3.8'

services:
  # -------------------------------------------------------------
  # Frontend Application (React + Vite + Tailwind CSS)
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-tablekeeper-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_API_BASE_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    networks:
      - tablekeeper-net

  # -------------------------------------------------------------
  # Backend API (FastAPI + Firebase Firestore)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-tablekeeper-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - PROJECT_NAME=Smart Tablekeeper
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-smart-tablekeeper}
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-/run/secrets/firebase-service-account.json}
      - FIREBASE_EMULATOR_HOST=${FIREBASE_EMULATOR_HOST:-}
      - FIRESTORE_DATABASE=${FIRESTORE_DATABASE:-(default)}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_started
    networks:
      - tablekeeper-net

  # -------------------------------------------------------------
  # -------------------------------------------------------------
  # Redis (Cache, Distributed Locking, Ephemeral State)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smart-tablekeeper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tablekeeper-net

volumes:
  redis_data:
    driver: local

networks:
  tablekeeper-net:
    driver: bridge
